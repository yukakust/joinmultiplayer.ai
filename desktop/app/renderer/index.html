<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; script-src 'self'; style-src 'self'">
  <title>Pocket i</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main class="forge" aria-label="Pocket i setup console">
    <img class="chassis" src="assets/forge-chassis-texture-v1.png" alt="">

    <section class="main-screen">
      <div id="setup-view">
        <header>
          <div class="brand"><span></span><i></i></div>
          <h1>Wake your i.</h1>
        </header>
        <div class="progress" aria-hidden="true"><span id="bar"></span></div>
        <p id="progress-label" class="detail">Checking…</p>
        <button id="install" hidden>WAKE i</button>
        <p id="error" class="error" hidden></p>
      </div>

      <section id="chat-view" class="chat" hidden>
        <div class="chat-mark"><div class="brand"><span></span><i></i></div><small>POCKET i</small></div>
        <div id="messages" class="messages" aria-live="polite"><p class="message from-i">I’m awake.</p></div>
        <form id="chat-form" class="composer">
          <label class="sr-only" for="chat-input">Ask Pocket i</label>
          <textarea id="chat-input" rows="2" maxlength="4000" placeholder="Ask something…"></textarea>
          <button id="send" type="submit" aria-label="Send">→</button>
        </form>
      </section>
    </section>

    <aside class="status-screen">
      <small>POCKET i</small>
      <ol>
        <li class="current"><span>01</span><div><strong>QWEN3 8B</strong><p id="model-status">checking</p></div></li>
        <li><span>02</span><div><strong>RUNTIME</strong><p id="runtime-status">checking</p></div></li>
        <li><span>03</span><div><strong>MEMORY</strong><p id="library-status">waiting</p></div></li>
      </ol>
      <p id="library-detail" class="library-detail">Codex 0 · Claude 0</p>
      <p class="privacy">Nothing leaves this device.</p>
    </aside>
  </main>
  <script src="app.js"></script>
</body>
</html>
