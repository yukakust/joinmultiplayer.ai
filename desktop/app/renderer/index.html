<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; script-src 'self'; style-src 'self'">
  <title>Pocket i</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main class="forge" aria-label="Pocket i setup console">
    <img class="chassis" src="assets/forge-chassis-texture-v1.png" alt="">

    <section class="main-screen">
      <header>
        <div class="brand"><span></span><i></i></div>
        <h1>Wake your i.</h1>
      </header>

      <div class="progress" aria-hidden="true"><span id="bar"></span></div>
      <p id="progress-label" class="detail">Checking…</p>
      <button id="install" hidden>WAKE i</button>
      <p id="error" class="error" hidden></p>
    </section>

    <aside class="status-screen">
      <small>POCKET i</small>
      <ol>
        <li class="current"><span>01</span><div><strong>QWEN3 8B</strong><p id="model-status">checking</p></div></li>
        <li><span>02</span><div><strong>RUNTIME</strong><p>next</p></div></li>
        <li><span>03</span><div><strong>MEMORY</strong><p id="library-status">waiting</p></div></li>
      </ol>
      <p id="library-detail" hidden></p>
      <p class="privacy">Nothing leaves this device.</p>
    </aside>
  </main>
  <script src="app.js"></script>
</body>
</html>
