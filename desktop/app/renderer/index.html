<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'">
  <title>Pocket i</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main>
    <header><div class="mark"><span></span><i></i></div><div><small>POCKET i · ALPHA</small><h1>Set up your pocket i.</h1></div></header>

    <section class="step active">
      <div><small>STEP 1</small><h2>Local model</h2><p>Qwen3 8B · 5.03 GB</p></div>
      <div class="action"><strong id="model-status">CHECKING</strong><button id="install" hidden>DOWNLOAD MODEL</button></div>
      <div class="progress"><span id="bar"></span></div>
      <p id="progress-label" class="detail">Checking memory and free space…</p>
    </section>

    <section class="step">
      <div><small>STEP 2</small><h2>Local runtime</h2><p>llama.cpp for this computer</p></div>
      <strong>NEXT</strong>
    </section>

    <section class="step">
      <div><small>STEP 3</small><h2>Codex library</h2><p id="library-detail">Waiting for the model</p></div>
      <strong id="library-status">WAITING</strong>
    </section>

    <section class="ask">
      <label for="prompt">Ask your pocket i</label>
      <textarea id="prompt" disabled placeholder="Available after setup is complete."></textarea>
    </section>
    <p id="error" class="error" hidden></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
