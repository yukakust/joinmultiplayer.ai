<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E007 · 30 проверок</title><link rel="stylesheet" href="/styles.css"><style>
main{max-width:none;width:100%;padding:clamp(20px,3vw,54px)}h1{font-size:clamp(36px,6vw,86px);line-height:.95}.metrics{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid #3a3934;margin:32px 0}.metrics div{padding:22px;border-right:1px solid #3a3934}.metrics div:last-child{border:0}.metrics span{display:block;color:#88857d}.metrics strong{display:block;font-size:clamp(30px,4vw,64px);margin-top:10px}.good{color:#76a96d}.bad{color:#df6b54}.warn{color:#d4a04e}.buttons{display:flex;gap:10px;margin:24px 0}.buttons button{background:transparent;color:inherit;border:1px solid #5b554b;padding:10px 16px;font:inherit}.buttons button.active{border-color:#df7428;color:#df7428}.cards{display:grid;gap:18px}.card{border:1px solid #3a3934;padding:22px}.card.fail{border-left:6px solid #df6b54}.card.pass{border-left:6px solid #76a96d}.head{display:flex;justify-content:space-between;gap:20px}.flow{display:grid;grid-template-columns:1.1fr 1fr 1.4fr;gap:16px;margin-top:18px}.box{background:#0c0b09;padding:16px}.box p{margin:.6em 0;line-height:1.45}.muted{color:#88857d}.pill{display:inline-block;border:1px solid currentColor;border-radius:99px;padding:3px 8px}.quote{color:#b6b0a4;font-size:.92em}@media(max-width:900px){.metrics{grid-template-columns:1fr 1fr}.metrics div{border-bottom:1px solid #3a3934}.flow{grid-template-columns:1fr}}
</style></head><body><main><p>E007 · CHECKPOINT 7S.2</p><h1>30 вопросов.<br>Вся цепочка.</h1><p>Зелёный — обе нужные части найдены или система правильно промолчала. Красный — потеряна часть ответа либо принят чужой шум.</p><section class="metrics" id="metrics"></section><div class="buttons"><button data-filter="fail" class="active">Сначала 4 ошибки</button><button data-filter="all">Все 30</button><button data-filter="empty">Только без ответа</button></div><section class="cards" id="cards">Загрузка…</section></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let rows=[];
function render(filter='fail'){const shown=rows.filter(r=>filter==='all'||filter==='fail'&&!r.evaluation.passed||filter==='empty'&&r.kind==='no_answer_in_packet');document.querySelector('#cards').innerHTML=shown.map(r=>{const expected=r.kind==='answerable'?`${r.expected.cause}<br>${r.expected.action}`:'В этой корзине ответа нет.';const selected=r.selected.length?r.selected.map(x=>`${x.handle} · ${x.source_id}`).join('<br>'):'Ничего — это правильно для пустого случая.';const extracted=r.extractions.flatMap(x=>x.accepted.map(a=>`<p><b>${esc(a.claim)}</b><br><span class="quote">${esc(a.exact_quote)}</span></p>`)).join('')||'<p>Ничего не извлечено.</p>';return `<article class="card ${r.evaluation.passed?'pass':'fail'}"><div class="head"><div><b>${esc(r.id)}</b> · ${r.kind==='answerable'?'ЕСТЬ ОТВЕТ':'ОТВЕТ УБРАН'}</div><span class="pill ${r.evaluation.passed?'good':'bad'}">${r.evaluation.passed?'ВЕРНО':'ОШИБКА'}</span></div><h2>${esc(r.question)}</h2><div class="flow"><div class="box"><span class="muted">Что ожидали</span><p>${expected}</p></div><div class="box"><span class="muted">Какие сообщения выбрала Qwen</span><p>${selected}</p></div><div class="box"><span class="muted">Что извлекла и чем доказала</span>${extracted}</div></div></article>`}).join('')||'<p>Нет случаев.</p>'}
Promise.all([fetch('/experiments/E007/desktop-two-stage-message-extraction-checkpoint7s2-result-v0.1.json').then(r=>r.json()),fetch('/experiments/E007/desktop-two-stage-message-extraction-checkpoint7s2-human-audit-v0.1.json').then(r=>r.json())]).then(([d,a])=>{rows=d.rows;const s=a.corrected_summary;document.querySelector('#metrics').innerHTML=`<div><span>нужные сообщения выбраны</span><strong class="good">${s.required_messages_selected}/${s.required_messages_total}</strong></div><div><span>доказательства извлечены</span><strong>${s.required_evidence_extracted}/${s.required_messages_total}</strong></div><div><span>полные ответы</span><strong>${s.answerable_cases_complete}/${s.answerable_cases_total}</strong></div><div><span>правильно промолчала</span><strong>${s.no_answer_cases_correctly_empty}/${s.no_answer_cases_total}</strong></div><div><span>весь тест</span><strong>${s.strict_cases_passed}/${s.strict_cases_total}</strong></div>`;render()}).catch(e=>document.querySelector('#cards').textContent='Не удалось загрузить результат.');document.querySelectorAll('button').forEach(b=>b.onclick=()=>{document.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.filter)})
</script></body></html>
