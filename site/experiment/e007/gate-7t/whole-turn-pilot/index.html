<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>E007 · Whole-turn outbound pilot</title>
  <style>
    :root{color-scheme:dark;--bg:#11100e;--panel:#1b1814;--line:#514538;--text:#f4ede1;--muted:#b8aa98;--ok:#8ac48a;--bad:#ef806d;--warn:#e2ae60}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}main{width:100%;padding:32px}.summary{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.pill{border:1px solid var(--line);padding:10px 14px;background:var(--panel)}table{width:100%;border-collapse:collapse;table-layout:fixed}th,td{border:1px solid var(--line);padding:14px;vertical-align:top;text-align:left}th{color:var(--muted)}pre{white-space:pre-wrap;word-break:break-word;margin:8px 0 0;font:inherit}.correct{border-left:6px solid var(--ok)}.real_failure{border-left:6px solid var(--bad)}.test_contract_defect,.correct_but_gold_wrong{border-left:6px solid var(--warn)}small{color:var(--muted)}@media(max-width:900px){main{padding:16px}table,thead,tbody,tr,th,td{display:block}thead{display:none}td{border-top:0}tr{display:block;margin-bottom:18px;border-top:1px solid var(--line)}}
  </style>
</head>
<body><main><h1>Whole-turn outbound pilot</h1><p>First preserved run. The architecture is not accepted from this run because two test defects were found.</p><div id="summary" class="summary"></div><table><thead><tr><th style="width:8%">Case</th><th style="width:25%">Question</th><th style="width:25%">What Qwen returned</th><th style="width:12%">Final state</th><th>Human verdict</th></tr></thead><tbody id="rows"></tbody></table></main>
<script>
Promise.all([
  fetch('/experiments/E007/outbound-whole-turn-pilot-result-v0.1.json').then(r=>r.json()),
  fetch('/experiments/E007/outbound-whole-turn-pilot-human-audit-v0.1.json').then(r=>r.json())
]).then(([result,audit])=>{
  summary.innerHTML=`<div class="pill">5 correct</div><div class="pill">2 test defects</div><div class="pill">1 real failure</div>`;
  const byId=Object.fromEntries(audit.rows.map(x=>[x.id,x]));
  rows.innerHTML=result.rows.map(r=>{const a=byId[r.id];return `<tr class="${a.verdict}"><td><b>${r.id}</b><br><small>${r.kind}</small></td><td>${esc(r.question)}</td><td><pre>${esc(r.raw_reader)}</pre></td><td><b>${r.terminal}</b></td><td><b>${esc(a.verdict)}</b><br>${esc(a.reason)}</td></tr>`}).join('');
}).catch(error=>{document.body.innerHTML='<main><h1>Could not load result</h1><pre>'+esc(String(error))+'</pre></main>'});
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script></body></html>
